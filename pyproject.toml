[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defectdock"
version = "0.1.0"
description = "Industrial computer-vision model lifecycle platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DefectDock Project" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10,<13",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
train = [
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]
cvat = ["cvat-sdk>=2.45,<3"]
dev = [
  "licensecheck==2026.0.8; python_version >= '3.12'",
  "pip-audit>=2.7,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
defectdock = "defectdock.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defectdock = ["resources/**/*.yaml", "db/alembic/script.py.mako"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
