name: GPU image smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-smoke:
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build locked GPU image
        run: |
          mkdir -p build/evidence/gpu
          docker build --build-arg DEFECTDOCK_INSTALL_TRAIN=1 \
            --build-arg DEFECTDOCK_BUILD_REVISION=${GITHUB_SHA} \
            --tag defectdock:gpu-${GITHUB_SHA} .
          docker image inspect defectdock:gpu-${GITHUB_SHA} --format '{{.Id}}' \
            > build/evidence/gpu/image-id.txt
      - name: Verify NVIDIA runtime and Torch CUDA
        run: |
          set -o pipefail
          docker run --rm --gpus all \
            -v "$PWD/scripts:/smoke:ro" \
            defectdock:gpu-${GITHUB_SHA} \
            python /smoke/check_gpu_runtime.py \
            | tee build/evidence/gpu/runtime.json
      - name: Run one-epoch CUDA training smoke
        run: |
          set -o pipefail
          docker run --rm --gpus all \
            -v "$PWD/scripts:/smoke:ro" \
            defectdock:gpu-${GITHUB_SHA} \
            python /smoke/smoke_train.py /data/hardware-smoke --device cuda \
            | tee build/evidence/gpu/training-smoke.json
      - name: Generate GPU image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: defectdock:gpu-${{ github.sha }}
          format: cyclonedx-json
          output-file: build/evidence/gpu/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record all GPU image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: defectdock:gpu-${{ github.sha }}
          fail-build: false
          severity-cutoff: negligible
          output-format: json
          output-file: build/evidence/gpu/vulnerabilities-all.json
      - name: Gate fixable GPU image vulnerabilities
        id: gpu_scan_gate
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: defectdock:gpu-${{ github.sha }}
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: json
          output-file: build/evidence/gpu/vulnerabilities-fixable.json
      - name: Hash GPU release evidence
        if: always()
        run: |
          cd build/evidence/gpu
          sha256sum image-id.txt runtime.json training-smoke.json sbom.cdx.json \
            vulnerabilities-all.json vulnerabilities-fixable.json > SHA256SUMS
      - name: Archive GPU release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: defectdock-gpu-release-evidence
          path: build/evidence/gpu
          if-no-files-found: error
          retention-days: 90
      - name: Enforce GPU vulnerability gate
        if: steps.gpu_scan_gate.outcome == 'failure'
        run: exit 1
