name: Bug report
description: Report a reproducible DefectDock defect without sensitive data
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Remove credentials, customer data and private paths.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
