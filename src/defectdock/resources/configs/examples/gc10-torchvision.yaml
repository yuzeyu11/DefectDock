schema_version: 1
project: gc10-baseline
task: object-detection
engine: torchvision
model: fasterrcnn-resnet50-fpn-v2
dataset:
  path: datasets/gc10-v1/data.yaml
  version: gc10-v1
train:
  epochs: 1
  imgsz: 640
  batch: 2
  device: auto
  workers: 0
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  step_size: 8
  gamma: 0.1
  seed: 42
  pretrained: true
  score_threshold: 0.25
  iou_threshold: 0.5
output_root: outputs
